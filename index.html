<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1255a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Authenticator">
<meta name="description" content="Temporary 6-digit demonstration authenticator code generator">
<title>Authenticator</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));font-family:Arial,system-ui,sans-serif;background:linear-gradient(135deg,#071b3d,#1255a0);color:#fff;-webkit-tap-highlight-color:transparent;user-select:none}
.card{width:min(390px,100%);padding:32px 25px;border-radius:26px;text-align:center;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 25px 60px rgba(0,0,0,.3)}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;border:2px solid #f4cf58;color:#f4cf58;font-size:18px;font-weight:900;letter-spacing:1px}
h1{margin:0 0 7px;font-size:28px}.sub{color:#c9d8ed;font-size:14px;margin-bottom:25px}
.code{font-size:40px;letter-spacing:9px;font-weight:900;color:#f4cf58;margin:20px 0;font-variant-numeric:tabular-nums}
.timer{font-size:14px;color:#d7e2f2}.bar{height:6px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden;margin-top:18px}.progress{height:100%;width:100%;background:#f4cf58;transition:width 1s linear}
.badge{display:inline-block;margin-top:20px;padding:7px 12px;border-radius:20px;background:rgba(244,207,88,.13);border:1px solid rgba(244,207,88,.3);color:#ffe9a0;font-size:12px}
.install-btn{display:none;margin-top:16px;padding:10px 18px;border:none;border-radius:12px;background:#f4cf58;color:#071b3d;font-weight:700;font-size:14px;cursor:pointer}
.install-btn:active{opacity:.85}
</style>
</head>
<body>
<main class="card">
  <div class="logo">AUTH</div>
  <h1>Authenticator</h1>
  <p class="sub">Temporary 6-digit demonstration code</p>
  <div id="code" class="code">------</div>
  <div id="timer" class="timer">Generating code…</div>
  <div class="bar"><div id="progress" class="progress"></div></div>
  <div class="badge">New code every 60 seconds</div>
  <button id="install" class="install-btn" type="button">Install App</button>
</main>
<script>
(function(){
  const codeEl=document.getElementById('code');
  const timerEl=document.getElementById('timer');
  const progressEl=document.getElementById('progress');
  const installBtn=document.getElementById('install');
  let remaining=60;
  function generate(){
    codeEl.textContent=String(Math.floor(100000+Math.random()*900000));
    remaining=60;
  }
  generate();
  setInterval(function(){
    remaining--;
    if(remaining<=0) generate();
    timerEl.textContent='New code in '+remaining+'s';
    progressEl.style.width=(remaining/60*100)+'%';
  },1000);

  // PWA install prompt
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // Service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
